[project]
name = "spectrum-toolkit"
version = "0.0.1"
description = "Load, process and plot spectroscopic data (Raman, IR, UV-Vis, ...)."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Vikas Yadav" }]
dependencies = [
    "numpy>=1.26",
    "openpyxl>=3.1",
    "scipy>=1.11",
    "xlrd>=2.0",
]

[project.optional-dependencies]
# Only needed to draw plots (stk.plot, stk.compare); the web server does not need it.
plot = ["matplotlib>=3.8"]

[dependency-groups]
dev = [
    "pytest>=8",
    "jupyterlab>=4",
    "matplotlib>=3.8",
    "ipywidgets>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spectrum_toolkit"]

[tool.pytest.ini_options]
# Also run the examples written in docstrings, so documentation cannot go stale.
testpaths = ["tests", "src"]
addopts = "--doctest-modules"
