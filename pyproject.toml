[project]
name = "spectrum-toolkit"
version = "0.0.1"
description = "Load, process and plot spectroscopic data (Raman, IR, UV-Vis, ...)."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Vikas Yadav" }]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "jupyterlab>=4",
    "matplotlib>=3.8",
    "ipywidgets>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spectrum_toolkit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
